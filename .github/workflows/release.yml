name: Release from Cargo.toml

on:
  push:
    branches:
      - main

jobs:

  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  debugbridge-binary:
    name: Build and attach xvc-bridge binary
    needs: release-plz-release
    if: >-
      needs.release-plz-release.outputs.releases_created == 'true'
      && contains(fromJSON(needs.release-plz-release.outputs.releases).*.package_name, 'xvc-server-debugbridge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: release
        run: |
          echo '${{ needs.release-plz-release.outputs.releases }}' \
            | jq -r '.[] | select(.package_name == "xvc-server-debugbridge")
                         | "tag=\(.tag)", "version=\(.version)"' \
            >> "$GITHUB_OUTPUT"

      - *checkout
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          args: '--release --locked -p xvc-server-debugbridge'
          target: aarch64-unknown-linux-gnu
          toolchain: stable

      - name: Create archive
        id: archive
        run: |
          NAME="xvc-bridge-v${{ steps.release.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
          tar -czf "$NAME" -C target/aarch64-unknown-linux-gnu/release xvc-bridge
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "${{ steps.archive.outputs.name }}" --clobber
