[package]
name = "xvc-server-usb"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "hardware-support", "embedded"]
keywords = ["jtag", "fpga", "xvc", "ftdi", "usb"]
homepage.workspace = true
documentation = "https://github.com/Schottkyc137/xvc-rs/tree/main/xvc-server-usb"
description = "Xilinx Virtual Cable (XVC) server that exposes a JTAG chain connected through a USB-to-JTAG bridge"

[dependencies]
log = "0.4.28"
clap = { version = "4.5.52", features = ["derive"] }
env_logger = "0.11.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
xvc-protocol = { version = "0.2.1", path = "../xvc-protocol" }
xvc-server = { version = "0.3.0", path = "../xvc-server" }
rusb = { version = "0.9.4", features = ["vendored"] }
ftdi-mpsse = "0.1.2"
inquire = "0.9.4"

[[bin]]
name = "xvc-usb"
path = "src/main.rs"
