[package]
name = "xvc-client"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["network-programming", "hardware-support", "embedded"]
keywords = ["jtag", "fpga", "xvc", "amd", "vivado"]
homepage.workspace = true
description = "Library for connecting to Xilinx Virtual Cable (XVC) servers and performing remote JTAG operations"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
xvc-protocol = { version = "0.2.1", path = "../xvc-protocol", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
